[package]
name = "zarr"
version = "0.0.1"
edition = "2018"
license = "MIT/Apache-2.0"
authors = [
  "Andrew Champion <andrew.champion@gmail.com>",
  "Chris L. Barnes <chrislloydbarnes@gmail.com>",
]
description = "Rust implementation of the Zarr core protocol for storage and retrieval of N-dimensional typed arrays"
readme = "README.md"
repository = "https://github.com/aschampion/rust-zarr"
keywords = ["tensor"]
categories = ["encoding", "filesystem", "science"]

[features]
default = ["bzip", "gzip", "lz", "use_ndarray", "xz", "blosc"]

blosc = ["dep:blosc-src"]
bzip = ["dep:bzip2"]
gzip = ["flate2/zlib"]
gzip_pure = ["dep:flate2"]
lz = ["dep:lz4", "blosc-src/lz4"]
use_ndarray = ["dep:itertools", "dep:ndarray"]
xz = ["dep:xz2"]

[dependencies]
anyhow = "1.0"
byteorder = "1.3.4"
camino = "1.1"
half = { version = "2.5", features = ["serde", "std", "rand_distr"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = { version = "1", features = ["serde"] }
thiserror = "2"

blosc-src = { version = "0.3.0", optional = true, features = ["zstd"] }
bzip2 = { version = "0.5", optional = true }
flate2 = { version = "1.0.22", optional = true }
itertools = { version = "^0.11", optional = true }
lz4 = { version = "1.23", optional = true }
ndarray = { version = "=0.15.6", optional = true }
xz2 = { version = "0.1", optional = true }

[dev-dependencies]
criterion = "0.5"
bencher = "0.1.5"
rand = "0.9"
rand_distr = "0.5"
tempfile = "3"


[profile.release]
lto = true

[profile.bench]
lto = true

[[bench]]
harness = false
name = "simple"
